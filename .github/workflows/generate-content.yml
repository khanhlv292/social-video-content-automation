name: Generate social video content

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic slug or exact topic name"
        required: false
        default: ""
      publish:
        description: "Send to the configured official publisher adapter"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PUBLISH_MODE: ${{ inputs.publish == true && 'webhook' || 'dry-run' }}
      PUBLISH_WEBHOOK_URL: ${{ secrets.PUBLISH_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate content package
        run: |
          PYTHONPATH=src python -m app --topic "${{ inputs.topic }}" --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: social-content-${{ github.run_id }}
          path: artifacts/
