name: Generate social video content

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic slug or exact topic name"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PUBLISH_MODE: dry-run
      ENABLE_PUBLISHING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate content package
        run: |
          PYTHONPATH=src python -m app --topic "${{ inputs.topic }}" --output artifacts --render
      - uses: actions/upload-artifact@v4
        with:
          name: social-content-${{ github.run_id }}
          path: artifacts/
